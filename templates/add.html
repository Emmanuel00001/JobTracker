<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 520px;
        }

        h1 {
            color: #1B3A6B;
            font-size: 22px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1B3A6B;
        }

        textarea { resize: vertical; height: 100px; }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .submit-btn {
            flex: 1;
            background: #1B3A6B;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover { background: #142d52; }

        .cancel-btn {
            flex: 1;
            background: #f0f4f8;
            color: #555;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .cancel-btn:hover { background: #e0e7ef; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add Job Application</h1>

        <form method="POST">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="company" placeholder="e.g. Google Dublin" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" name="role" placeholder="e.g. Junior Software Engineer" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="e.g. Dublin, Ireland" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date Applied</label>
                <input type="date" name="date_applied">
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea name="notes" placeholder="Any additional notes..."></textarea>
            </div>
            <div class="buttons">
                <button type="submit" class="submit-btn">Save Application</button>
                <a href="/" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
